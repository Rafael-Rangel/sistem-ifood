<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Icare Finance</title>
  <script>
    try {
      if (!localStorage.getItem("icare.session")) location.replace("./login.html");
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="./public/images/logo-simbol-color.svg">
  <link href="./bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body data-bs-theme="light">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="main-structure navbar-expand-lg">
    <aside id="collapseExample" class="main-sidebar">
      <header class="brand pb-4">
        <img src="./public/images/logo-simbol-color.svg" alt="Icare Finance">
      </header>
      <div class="body flex-fill">
        <nav>
          <small class="menu-title">Painel</small>
          <ul class="navbar-nav flex-column">
            <li class="nav-item">
              <a class="nav-link active" href="#/inicio" data-route="inicio">
                <icon-set class="bi" imageUrl="./public/icons/icon-home-stats.svg"></icon-set>Início
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/gestao" data-route="gestao">
                <icon-set class="bi" imageUrl="./public/icons/icon-brand-cashapp.svg"></icon-set>Gestão e Pagamentos
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/repasses" data-route="repasses">
                <icon-set class="bi" imageUrl="./public/icons/icon-settings-dollar.svg"></icon-set>Repasses iFood
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/cardapio" data-route="cardapio">
                <icon-set class="bi" imageUrl="./public/icons/icon-flag-check.svg"></icon-set>Cardápio
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/analises" data-route="analises">
                <icon-set class="bi" imageUrl="./public/icons/icon-presentation-analytics.svg"></icon-set>Relatórios e Análises
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/seguranca" data-route="seguranca">
                <icon-set class="bi" imageUrl="./public/icons/icon-shield-cog.svg"></icon-set>Segurança e Acesso
              </a>
            </li>
          </ul>
        </nav>
        <nav>
          <small class="menu-title">Atendimento</small>
          <ul class="navbar-nav flex-column">
            <li class="nav-item">
              <a class="nav-link" href="#/mensagens" data-route="mensagens">
                <icon-set class="bi" imageUrl="./public/icons/icon-brand-messenger.svg"></icon-set>Mensagens
                <span class="nav-badge" data-msg-count hidden>0</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/avaliacoes" data-route="avaliacoes">
                <icon-set class="bi" imageUrl="./public/icons/icon-star.svg"></icon-set>Avaliações
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#/ajuda" data-route="ajuda">
                <icon-set class="bi" imageUrl="./public/icons/icon-help.svg"></icon-set>Ajuda
              </a>
            </li>
          </ul>
        </nav>
      </div>
      <footer>
        <div class="d-flex align-items-center px-3 py-3">
          <div class="rounded-pills p-i me-3">
            <img src="./public/images/image-placeholder.png" width="40" class="object-fit-cover border rounded-pill" alt="Rafael Rangel">
          </div>
          <div class="flex-fill pe-2 user-chip">
            <h6 class="mb-0" id="user-name">Rafael Rangel</h6>
            <small id="user-role">Administrador</small>
          </div>
          <button class="btn btn-outline-danger border-0 px-2" data-logout aria-label="Sair">
            <icon-set imageUrl="./public/icons/icon-logout.svg"></icon-set>
          </button>
        </div>
      </footer>
    </aside>

    <div class="main-content">
      <header class="container-fluid page-header border-bottom py-2">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb m-0">
            <li class="breadcrumb-item active" id="crumb">Início</li>
          </ol>
        </nav>
        <div class="d-flex align-items-center gap-2">
          <h2 class="m-0 flex-fill" id="page-title">Início</h2>
          <div class="header-actions d-flex align-items-center gap-2">
            <button class="btn btn-light" data-go="mensagens" aria-label="Mensagens">
              <icon-set imageUrl="./public/icons/icon-brand-messenger.svg"></icon-set>
              <span class="dot-alert" data-msg-count-dot></span>
            </button>
            <button class="btn btn-light" data-open="notices" aria-label="Notificações">
              <icon-set imageUrl="./public/icons/icon-bell.svg"></icon-set>
              <span class="dot-alert" data-notice-dot></span>
            </button>
            <button class="btn btn-primary rounded-pill d-lg-none" data-toggle-sidebar aria-label="Abrir menu">
              <icon-set imageUrl="./public/icons/icon-menu-outline.svg"></icon-set>
            </button>
          </div>
        </div>
      </header>
      <div id="view"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navegação mobile">
    <a href="#/inicio" data-route="inicio"><icon-set imageUrl="./public/icons/icon-home-stats.svg"></icon-set>Início</a>
    <a href="#/gestao" data-route="gestao"><icon-set imageUrl="./public/icons/icon-brand-cashapp.svg"></icon-set>Gestão</a>
    <a href="#/repasses" data-route="repasses"><icon-set imageUrl="./public/icons/icon-settings-dollar.svg"></icon-set>Repasse</a>
    <a href="#/cardapio" data-route="cardapio"><icon-set imageUrl="./public/icons/icon-flag-check.svg"></icon-set>Cardápio</a>
    <a href="#/mensagens" data-route="mensagens"><icon-set imageUrl="./public/icons/icon-brand-messenger.svg"></icon-set>Chat</a>
  </nav>

  <div class="toast-stack" id="toast-stack"></div>
  <div class="modal-layer" id="modal-layer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="./js/Iconset.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
