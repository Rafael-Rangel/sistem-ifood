<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Criar conta · Icare Finance</title>
  <link href="./bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="icon" type="image/svg+xml" href="./public/images/logo-simbol-color.svg">
</head>
<body class="bg-register">
  <div class="register-container mx-auto py-5 auth-card">
    <img class="p-4 mx-auto mb-3 stagger" width="280" src="./public/images/logo-simbol-text-color.svg" alt="Icare Finance">
    <div class="card shadow w-100">
      <div class="card-body">
        <div class="alert alert-danger auth-alert" id="auth-alert" role="alert"></div>
        <form id="register-form">
          <div class="row">
            <div class="col-12 mb-3 stagger">
              <label for="nomeCompleto" class="form-label">Nome completo</label>
              <input type="text" class="form-control" id="nomeCompleto" name="name" placeholder="Escreva aqui" required>
            </div>
            <div class="col-12 col-md-6 mb-3 stagger">
              <label class="form-label" for="nascimento">Data de nascimento</label>
              <input class="form-control" id="nascimento" name="birth" type="date" required>
            </div>
            <div class="col-12 col-md-6 mb-3 stagger">
              <label for="sexo" class="form-label">Sexo</label>
              <select class="form-select" id="sexo" name="gender" required>
                <option value="">Selecione</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Não informar">Não informar</option>
              </select>
            </div>
            <div class="col-12 mb-3 stagger">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com" required>
            </div>
            <div class="col-12 col-md-6 mb-3 stagger">
              <label class="form-label" for="cpf">CPF</label>
              <input class="form-control" id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" required>
            </div>
            <div class="col-12 col-md-6 mb-3 stagger">
              <label class="form-label" for="cnpj">CNPJ</label>
              <input class="form-control" id="cnpj" name="cnpj" type="text" inputmode="numeric" placeholder="00.000.000/0000-00" required>
            </div>
            <div class="col-12 mb-3 stagger">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" id="senha" name="password" class="form-control" minlength="8" required>
            </div>
            <div class="col-12 mb-3 stagger">
              <label for="confirmacaoSenha" class="form-label">Confirme sua senha</label>
              <input type="password" id="confirmacaoSenha" name="confirm" class="form-control" minlength="8" required>
              <div class="form-text">Entre 8 e 20 caracteres, com letras, números e especial. Sem espaços.</div>
            </div>
          </div>
          <button class="btn btn-lg w-100 btn-primary mb-3 stagger" type="submit">Cadastrar</button>
          <a class="btn w-100 btn-light stagger" href="./login.html">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
