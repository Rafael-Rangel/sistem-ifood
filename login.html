<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Entrar · Icare Finance</title>
  <link href="./bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./css/login.css">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="icon" type="image/svg+xml" href="./public/images/logo-simbol-color.svg">
</head>
<body class="login-container">
  <div class="container-fluid h-100 login-panel">
    <div class="row h-100 g-0">
      <div class="d-none d-lg-flex align-items-center col-lg-5 h-100 auth-visual">
        <img id="ifood-login-image" src="./public/images/Design%20sem%20nome%20(97).png" alt="Painel do restaurante">
      </div>
      <div class="col-12 col-lg-7 bg-primary h-100 d-flex align-items-center justify-content-center">
        <div class="form-signin d-flex flex-column align-items-center auth-card">
          <form id="login-form" class="login-form-wrap d-flex flex-column">
            <div class="d-flex flex-column align-items-center stagger">
              <img class="mb-4" id="ifood-logo" src="./public/images/logo-simbol-text-white.svg" alt="Icare Finance">
            </div>
            <div class="alert alert-light text-danger auth-alert stagger" id="auth-alert" role="alert"></div>
            <div class="form-floating mb-3 stagger">
              <input type="email" class="form-control" id="floatingInput" placeholder="nome@exemplo.com" required value="rafael@icare.finance">
              <label for="floatingInput">E-mail</label>
            </div>
            <div class="form-floating mb-3 stagger">
              <input type="password" class="form-control" id="floatingPassword" placeholder="Senha" required value="ifood2024">
              <label for="floatingPassword">Senha</label>
            </div>
            <button class="btn btn-lg btn-login text-white mb-3 stagger" type="submit">Entrar</button>
            <p class="text-center text-white stagger">
              <a class="text-decoration-none login-link" href="#" id="forgot-link">Esqueceu a senha?</a>
            </p>
            <p class="demo-hint stagger mb-4">
              Demo: <strong>rafael@icare.finance</strong><br>Senha: <strong>ifood2024</strong>
            </p>
            <p class="text-center text-white stagger">Não tem uma conta de parceiro? <a class="login-link" href="./cadastro.html">Criar conta</a></p>
            <div class="footer-login text-center stagger mt-3">
              <img src="./public/images/footer_login.png" alt="iFood e FIAP" class="img-fluid" style="max-width:220px">
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
